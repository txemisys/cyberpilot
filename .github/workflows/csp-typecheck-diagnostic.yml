name: CSP typecheck diagnostic

on:
  push:
    branches:
      - security/csp-report-only

permissions:
  contents: write

jobs:
  diagnose:
    if: ${{ !contains(github.event.head_commit.message, 'capture typecheck diagnostic') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: "22.12.0"
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Capture typecheck
        shell: bash
        run: |
          set +e
          pnpm --filter @cyberpilot/web typecheck > typecheck-output.txt 2>&1
          status=$?
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add typecheck-output.txt
          git commit -m "ci: capture typecheck diagnostic"
          git push
          exit 0
