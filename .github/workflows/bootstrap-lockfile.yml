name: Bootstrap lockfile

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - chore/reproducible-installs

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Stop when lockfile already exists
        id: lockfile
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Enable Corepack
        if: steps.lockfile.outputs.exists != 'true'
        run: corepack enable

      - name: Set up Node.js
        if: steps.lockfile.outputs.exists != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "22.12.0"
          package-manager-cache: false

      - name: Generate pnpm lockfile
        if: steps.lockfile.outputs.exists != 'true'
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Commit generated lockfile
        if: steps.lockfile.outputs.exists != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: commit pnpm lockfile"
          git push
