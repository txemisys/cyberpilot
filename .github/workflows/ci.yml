name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cyberpilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cyberpilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cyberpilot
      AUTH_SECRET: ci-only-secret-not-used-in-production
      BETTER_AUTH_URL: https://ci.cyberpilot.example
      MICROSOFT_CLIENT_ID: ci-login-client
      MICROSOFT_CLIENT_SECRET: ci-login-secret
      M365_GRAPH_CLIENT_ID: ci-scanner-client
      M365_GRAPH_CLIENT_SECRET: ci-scanner-secret
      M365_GRAPH_REDIRECT_URI: https://ci.cyberpilot.example/api/integrations/microsoft-365/callback

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.12.0"
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Validate Prisma schema
        run: pnpm --filter @cyberpilot/database db:validate

      - name: Apply database migrations
        run: pnpm db:migrate:deploy

      - name: Verify migration status
        run: pnpm db:migrate:status

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
